<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bistrô Marajó | Cardápio Digital</title>
    <link rel="stylesheet" href="css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
  </head>

  <body>
    <header>
      <div class="header-container">
        <div class="logo-container">
          <h1>Bistrô Marajó</h1>
          <p>Culinária Afetiva</p>
        </div>

        <div class="status-badge open">Aberto Agora</div>
      </div>
    </header>

    <main>
      <section id="hero-suggestion"></section>

      <nav class="menu-tabs" aria-label="Período do cardápio">
        <button
          class="tab-btn active"
          type="button"
          data-turno="almoco"
          aria-controls="almoco"
          aria-selected="true"
        >
          ☀️ Almoço
        </button>
        <button
          class="tab-btn"
          type="button"
          data-turno="jantar"
          aria-controls="jantar"
          aria-selected="false"
        >
          🌙 Jantar
        </button>
      </nav>

      <section id="almoco" class="menu-section active-section">
        <h3 class="section-title">Para o seu Almoço</h3>

        <div class="menu-grid" data-menu-grid="almoco" aria-live="polite"></div>
      </section>

      <section id="jantar" class="menu-section hidden-section">
        <h3 class="section-title">Especiais da Noite</h3>
        <div class="menu-grid" data-menu-grid="jantar" aria-live="polite"></div>
      </section>
    </main>

    <button
      class="carrinho-flutuante"
      type="button"
      aria-label="Abrir carrinho. Nenhum item adicionado"
      aria-controls="carrinho"
      aria-expanded="false"
    >
      <i class="fas fa-shopping-bag" aria-hidden="true"></i>
      <span class="carrinho-flutuante-texto">Ver pedido</span>
      <span class="carrinho-contador" aria-hidden="true" data-carrinho-contador>0</span>
    </button>

    <div class="carrinho-overlay" data-carrinho-overlay></div>

    <aside
      id="carrinho"
      class="carrinho-sidebar"
      role="dialog"
      aria-modal="true"
      aria-hidden="true"
      aria-labelledby="carrinho-titulo"
    >
      <div class="carrinho-header">
        <div>
          <span class="carrinho-eyebrow">Bistrô Marajó</span>
          <h2 id="carrinho-titulo">Seu Pedido</h2>
        </div>
        <button
          class="carrinho-fechar"
          type="button"
          aria-label="Fechar carrinho"
        >
          &times;
        </button>
      </div>

      <div class="carrinho-body">
        <div id="itens-carrinho" class="itens-carrinho"></div>

        <div class="carrinho-resumo">
          <div class="carrinho-total-linha">
            <span>Subtotal</span>
            <strong id="subtotal-carrinho">R$ 0,00</strong>
          </div>
          <div class="carrinho-total-linha">
            <span>Taxa de Entrega</span>
            <strong id="taxa-entrega">R$ 0,00</strong>
          </div>
          <div class="carrinho-total-linha carrinho-total-final">
            <span>Total</span>
            <strong id="total-carrinho">R$ 0,00</strong>
          </div>

          <form class="formulario-entrega" id="formulario-entrega" novalidate>
            <h3>Entrega e pagamento</h3>

            <div class="campo-formulario">
              <label for="nome-cliente">Nome</label>
              <input
                id="nome-cliente"
                name="nome"
                type="text"
                placeholder="Como podemos chamar você?"
                autocomplete="name"
                required
              />
            </div>

            <div class="campo-formulario">
              <label for="endereco-entrega">Endereço completo</label>
              <input
                id="endereco-entrega"
                name="endereco"
                type="text"
                placeholder="Rua, número, bairro e complemento"
                autocomplete="street-address"
                required
              />
            </div>

            <div class="campo-formulario">
              <label for="forma-pagamento">Forma de pagamento</label>
              <select id="forma-pagamento" name="pagamento">
                <option value="Pix">Pix</option>
                <option value="Cartão de Crédito">Cartão de Crédito</option>
                <option value="Cartão de Débito">Cartão de Débito</option>
                <option value="Dinheiro">Dinheiro</option>
              </select>
            </div>

            <div class="campo-formulario campo-troco hidden" data-campo-troco>
              <label for="troco">Troco para quanto?</label>
              <input
                id="troco"
                name="troco"
                type="number"
                min="0"
                step="0.01"
                inputmode="decimal"
                placeholder="0,00"
                disabled
              />
            </div>
          </form>
        </div>
      </div>

      <div class="carrinho-footer">
        <button
          class="btn-finalizar-carrinho"
          type="submit"
          form="formulario-entrega"
        >
          <i class="fab fa-whatsapp" aria-hidden="true"></i>
          Finalizar no WhatsApp
        </button>
      </div>
    </aside>

    <footer>
      <a
        class="footer-location-link"
        href="https://maps.app.goo.gl/2eJoMULDanDwJuk9A"
        target="_blank"
        rel="noopener noreferrer"
      >
        <i class="fas fa-map-marker-alt" aria-hidden="true"></i>
        <span>Andrelino Nunes, 82</span>
      </a>
      <p>&copy; 2026 Bistrô Marajó</p>
    </footer>

    <script src="js/script.js"></script>
  </body>
</html>
